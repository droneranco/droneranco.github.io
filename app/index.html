<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ranco</title>
<meta name="theme-color" content="#2E6A12">
<meta name="description" content="Agenda e informes de aplicación de Drone Ranco">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ranco">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1D2124;--muted:#5B5F63;--ground:#F4F6F1;--line:#E3E7DF;--field:#D5DBD0;--deep:#2E6A12;--deep2:#1F4A0C;--soft:#E9F5DC;--verde:#76C62B;--celeste:#40C1E4;--azul:#0E5E78;--azulsoft:#E2F5FB;--amber:#6B4200;--ambersoft:#FFF1D6;--rojo:#A3261D}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ground);color:var(--ink);font-family:Raleway,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font-family:inherit;font-size:15px;color:var(--ink)}
.franja{height:6px;background:linear-gradient(90deg,var(--verde),var(--celeste))}
.wrap{max-width:560px;margin:0 auto;padding-bottom:110px}
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 20px 6px;gap:10px}
.marca{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:.5px}
.marca img{width:34px;height:34px;border-radius:10px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:6px 10px;border-radius:999px;border:0}
.pill.amber{background:var(--ambersoft);color:var(--amber)}
.pill.ok{background:var(--soft);color:var(--deep)}
h1{margin:2px 0 0;font-size:26px;font-weight:800}
.sub{margin:0;font-size:13px;font-weight:600;color:var(--muted)}
.pad{padding:0 20px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding:16px 20px 0}
.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px}
.stat b{display:block;font-size:22px;font-weight:800}
.stat span{font-size:12px;color:var(--muted);font-weight:600}
h2.sec{margin:22px 20px 10px;font-size:14px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
.lista{display:flex;flex-direction:column;gap:12px;padding:0 20px}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px}
.fila{display:flex;justify-content:space-between;align-items:center;gap:10px}
.hora{font-size:13px;font-weight:700;color:var(--deep)}
.tag{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--soft);color:var(--deep);white-space:nowrap}
.tag.azul{background:var(--azulsoft);color:var(--azul)}
.tag.gris{background:#EEF0EC;color:var(--muted)}
.card h3{margin:0;font-size:19px;font-weight:800}
.card p{margin:0;font-size:14px;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;font-weight:600;background:var(--ground);padding:5px 10px;border-radius:8px}
.btn{height:46px;border-radius:12px;border:0;background:var(--deep);color:#fff;font-weight:700;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 16px;cursor:pointer;text-decoration:none}
.btn:active{background:var(--deep2)}
.btn.sec{background:#fff;color:var(--ink);border:1px solid var(--field)}
.btn.azul{background:var(--azulsoft);color:var(--azul)}
.btn.rojo{background:#fff;color:var(--rojo);border:1px solid #E7B9B4}
.btn.full{width:100%}
.btn.icon{width:46px;padding:0}
.aviso{display:flex;align-items:center;gap:12px;background:#FFF8EA;border:1px solid #F1D9A6;border-radius:16px;padding:12px 14px;font-size:14px;font-weight:600;color:var(--ink);text-decoration:none;cursor:pointer}
.vacio{text-align:center;color:var(--muted);font-size:14px;padding:24px 10px}
nav.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:flex-start;padding:8px 4px calc(12px + env(safe-area-inset-bottom));z-index:20}
nav.nav button{background:none;border:0;width:64px;height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:11px;font-weight:700;cursor:pointer}
nav.nav button.on{color:var(--deep);font-weight:800}
nav.nav button.mas{width:58px;height:58px;margin-top:-20px;border-radius:18px;background:linear-gradient(135deg,var(--verde),var(--celeste));color:#fff;box-shadow:0 6px 16px rgba(46,106,18,.3)}
.semana{display:grid;grid-template-columns:28px repeat(7,minmax(0,1fr)) 28px;gap:5px;padding:14px 12px 4px;align-items:center}
.dia{height:64px;border-radius:14px;border:1px solid var(--line);background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;padding:0}
.dia small{font-size:11px;font-weight:700;color:var(--muted)}
.dia b{font-size:17px;font-weight:800}
.dia i{width:6px;height:6px;border-radius:3px;background:transparent}
.dia i.si{background:var(--verde)}
.dia.on{background:var(--deep);border-color:var(--deep);color:#fff}
.dia.on small{color:#fff}
.dia.on i.si{background:#fff}
.flecha{background:none;border:0;height:44px;cursor:pointer;color:var(--muted);padding:0}
.ag{display:flex;gap:12px}
.ag .h{width:46px;padding-top:14px;font-size:13px;font-weight:800}
.ag .c{flex:1;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;gap:12px;margin-bottom:10px;cursor:pointer;text-align:left}
.ag .c .b{width:5px;border-radius:3px;background:var(--verde)}
.ag .c.hecha .b{background:#9AA09A}
.ag .c p{margin:3px 0 0;font-size:13px;color:var(--muted)}
.prox{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:14px;cursor:pointer}
.prox .d{width:48px;text-align:center}
.prox .d small{display:block;font-size:11px;font-weight:700;color:var(--muted)}
.prox .d b{font-size:20px;font-weight:800}
.prox p{margin:3px 0 0;font-size:13px;color:var(--muted)}
.sec-card{margin:12px 20px 0;background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px}
.sec-card h2{margin:0;font-size:15px;font-weight:800}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:700;color:var(--muted);min-width:0}
label.f input,label.f select,label.f textarea{height:46px;border-radius:10px;border:1px solid var(--field);padding:0 10px;font-size:15px;font-weight:600;background:#fff;width:100%;min-width:0}
label.f textarea{height:84px;padding:10px;resize:vertical}
label.f.req>span::after{content:" *";color:var(--rojo)}
.inline{display:flex;gap:6px}
.opc{display:flex;gap:8px;flex-wrap:wrap}
.opc button{height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--field);background:#fff;font-weight:700;font-size:14px;cursor:pointer}
.opc button.on{border:2px solid var(--deep);background:var(--soft);color:var(--deep);font-weight:800}
.ac-list{position:fixed;z-index:60;display:none;background:#fff;border:1px solid var(--field);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.18);overflow-y:auto;-webkit-overflow-scrolling:touch}
.ac-list button{display:block;width:100%;text-align:left;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:none;font-size:15px;font-weight:600;cursor:pointer}
.ac-list button:active,.ac-list button:hover{background:var(--soft)}
.ac-vacio{padding:10px 14px;font-size:13px;color:var(--muted)}
.prod>label:first-child{grid-column:1/-1}
.horas{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.hr{flex:0 0 auto;min-width:56px;text-align:center;border-radius:12px;background:var(--ground);padding:6px 4px;display:flex;flex-direction:column;gap:2px;font-size:12px}
.hr b{font-size:16px}
.v-ok{color:#2E6A12}.v-med{color:#9A5B00}.v-alto{color:#B3261E}
.card p.climachip{font-size:13px;color:var(--ink)}
.climadia{display:flex;gap:8px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.prod{display:grid;grid-template-columns:minmax(0,1fr) 110px 36px;gap:6px;align-items:end}
.prod input,.prod select{height:44px;border-radius:10px;border:1px solid var(--field);padding:0 8px;font-weight:600;width:100%;min-width:0;background:#fff}
.quitar{height:44px;border:0;background:none;color:var(--muted);cursor:pointer}
.cuartel{border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px}
.mas-btn{height:44px;border-radius:12px;border:1px dashed #9AA09A;background:#fff;font-weight:700;font-size:14px;color:var(--deep);cursor:pointer}
.tile{border-radius:14px;border:1px dashed #9AA09A;background:#FAFBF8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:132px;cursor:pointer;position:relative;overflow:hidden;text-align:center;padding:8px}
.tile.lleno{border:1px solid var(--line);padding:0}
.tile img{width:100%;height:132px;object-fit:cover;display:block}
.tile .lbl{font-size:13px;font-weight:700}
.tile small{font-size:11px;font-weight:600;color:var(--muted)}
.tile .x{position:absolute;top:6px;right:6px;width:30px;height:30px;border-radius:15px;border:0;background:rgba(0,0,0,.55);color:#fff;font-weight:800;cursor:pointer}
.tile input{display:none}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:700}
.switch button{width:56px;height:32px;border-radius:16px;border:0;background:#C9CEC5;position:relative;cursor:pointer}
.switch button::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:13px;background:#fff;transition:left .15s}
.switch button.on{background:var(--deep)}
.switch button.on::after{left:27px}
.pie{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 20px calc(16px + env(safe-area-inset-bottom));z-index:25}
.pie .in{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:6px}
.pie p{margin:0;text-align:center;font-size:12px;color:var(--muted);font-weight:600}
.error{background:#FDECEA;color:var(--rojo);border-radius:12px;padding:10px 12px;font-size:13px;font-weight:700;margin:12px 20px 0}
.info{background:var(--soft);color:var(--deep);border-radius:12px;padding:10px 12px;font-size:13px;font-weight:700;margin:8px 20px 0;display:flex;gap:8px;align-items:center}
.modal{position:fixed;inset:0;background:rgba(20,24,20,.45);display:flex;align-items:flex-end;justify-content:center;z-index:40}
.hoja{background:var(--ground);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:6px 0 24px}
.hoja .asa{width:44px;height:5px;border-radius:3px;background:#C9CEC5;margin:8px auto}
.toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 16px;border-radius:14px;font-size:14px;font-weight:600;max-width:90%;z-index:60;box-shadow:0 8px 20px rgba(0,0,0,.25)}
.barras{display:flex;align-items:flex-end;gap:12px;height:150px;padding:0 4px;border-bottom:1px solid var(--field)}
.barras div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;justify-content:flex-end;height:100%}
.barras span{font-size:12px;font-weight:800}
.barras i{width:100%;border-radius:8px 8px 0 0;background:#B9DE93;display:block}
.barras i.max{background:var(--deep)}
.ejes{display:flex;gap:12px;padding:6px 4px 0}
.ejes span{flex:1;text-align:center;font-size:12px;font-weight:700;color:var(--muted)}
.hbar{display:flex;align-items:center;gap:10px}
.hbar .n{width:130px;font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .t{flex:1;height:10px;background:#EEF1EA;border-radius:5px}
.hbar .t i{display:block;height:10px;background:var(--deep);border-radius:5px}
.hbar .v{width:46px;text-align:right;font-size:13px;font-weight:800}
.buscar{margin:12px 20px 0}
.buscar input{width:100%;height:46px;border-radius:12px;border:1px solid var(--field);padding:0 14px;font-size:15px;font-weight:600}
.cli{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;align-items:center;gap:12px;cursor:pointer;text-align:left;width:100%}
.ini{width:44px;height:44px;border-radius:14px;background:var(--soft);color:var(--deep);display:flex;align-items:center;justify-content:center;font-weight:800;flex:none}
.cargando{padding:60px 20px;text-align:center;color:var(--muted);font-weight:600}
.login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:32px 24px 60px;max-width:420px;margin:0 auto}
.login img{width:84px;height:84px;border-radius:22px;align-self:center;box-shadow:0 6px 24px rgba(46,106,18,.18)}
.login h1{text-align:center;margin:18px 0 4px;font-size:26px;letter-spacing:1px}
.login p.sub{text-align:center;margin:0 0 26px}
.login form{display:flex;flex-direction:column;gap:14px}
.login .error{margin:0}
.instalar{display:flex;align-items:center;gap:12px;background:var(--azulsoft);border-radius:16px;padding:12px 14px;margin:12px 20px 0;font-size:14px;font-weight:600;color:var(--azul)}
.instalar img{width:36px;height:36px;border-radius:9px}
.instalar span{flex:1}
.instalar .btn{height:38px;font-size:14px}
.instalar .x{background:none;border:0;color:var(--azul);font-size:20px;cursor:pointer;padding:0 4px}
body{padding-top:env(safe-area-inset-top)}
</style>
</head>
<body>
<div class="franja"></div>
<div id="app" class="wrap"><div class="cargando">Cargando Ranco…</div></div>
<div id="capa"></div>
<script>
const LOGO = 'icon-192.png';
const API_URL = 'https://script.google.com/macros/s/AKfycbyniS2Jnf7qTPAbWeG4okAzHkhNp9bpESim1Goy5VzpWjFY6XBbyZvYtZ_M94KhoRvE-g/exec';
const VERSION = '1.5';
const DIAS = ['DOM','LUN','MAR','MIÉ','JUE','VIE','SÁB'];
const DIAS_L = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const MESES_L = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const TIPOS = ['Líquida (pulverización)','Granulado / fertilizante','Siembra / cobertura'];
const EQUIPOS = ['Agras T50','Agras T70P'];
const UNIDADES = ['lt/ha','cc/ha','kg/ha','g/ha'];
const I = {
  sol:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  cal:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  mas:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',
  per:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4.5-6 8-6s7 2 8 6"/></svg>',
  bar:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
  doc:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h4"/></svg>',
  pin:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.1-7-11a7 7 0 0 1 14 0c0 4.9-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>',
  cam:'<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#2E6A12" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>',
  izq:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>',
  der:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>',
  reloj:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9A5B00" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  nube:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M2 2l20 20"/><path d="M8.5 16.5a5 5 0 0 1 7 0"/><path d="M5 12.5a10 10 0 0 1 5-2.8"/><path d="M19 12.5a10 10 0 0 0-2.6-1.9"/><circle cx="12" cy="20" r="1"/></svg>'
};
const S = { d: null, vista: 'hoy', dia: null, semana: null, form: null, error: '', cliente: null, filtro: '', enviando: false };

function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
class ErrorSesion extends Error {}
async function llamar(cuerpo, ms){
  const ctl = new AbortController(); const t = setTimeout(function(){ ctl.abort(); }, ms || 90000);
  let r;
  try {
    r = await fetch(API_URL, { method: 'POST', body: JSON.stringify(cuerpo), headers: { 'Content-Type': 'text/plain;charset=utf-8' }, redirect: 'follow', signal: ctl.signal });
  } catch (e) { throw new Error('Sin conexión (network failed)'); } finally { clearTimeout(t); }
  if (!r.ok) throw new Error('Sin conexión con el servidor (network ' + r.status + ')');
  let j; try { j = await r.json(); } catch (e) { throw new Error('Respuesta inválida del servidor (network)'); }
  if (j.auth === false) throw new ErrorSesion(j.error || 'Sesión expirada');
  if (!j.ok) throw new Error(j.error || 'Error del servidor');
  return j.data;
}
async function api(fn){
  const args = Array.prototype.slice.call(arguments,1);
  try { return await llamar({ accion: fn, token: localStorage.getItem('ranco_token') || '', args: args }); }
  catch (e) { if (e instanceof ErrorSesion) { localStorage.removeItem('ranco_token'); vLogin(e.message); throw new Error('Sesión expirada'); } throw e; }
}
function vLogin(msg){
  S.d = null;
  const u = localStorage.getItem('ranco_usuario') || '';
  document.getElementById('app').innerHTML = '<div class="login"><img src="' + LOGO + '" alt=""><h1>RANCO</h1><p class="sub">Agenda e informes de aplicación</p>' +
    '<form onsubmit="entrar(event)">' + (msg ? '<div class="error">' + esc(msg) + '</div>' : '') +
    '<label class="f"><span>Nombre</span><input id="lu" autocomplete="username" autocapitalize="words" value="' + esc(u) + '" required></label>' +
    '<label class="f"><span>Clave</span><input id="lc" type="password" autocomplete="current-password" required></label>' +
    '<button class="btn full" id="lb">Entrar</button></form></div>';
}
async function entrar(ev){
  ev.preventDefault();
  const b = document.getElementById('lb'); b.disabled = true; b.textContent = 'Entrando…';
  const u = document.getElementById('lu').value.trim(), c = document.getElementById('lc').value;
  try {
    const r = await llamar({ accion: 'login', usuario: u, clave: c }, 30000);
    localStorage.setItem('ranco_token', r.token); localStorage.setItem('ranco_usuario', r.usuario);

const CL = { pos: leerLocal('ranco_pos', null), datos: leerLocal('ranco_clima', null), lugares: {}, cargando: false, error: '' };
const WMO = [[0,'☀️','Despejado'],[1,'🌤️','Mayormente despejado'],[2,'⛅','Parcialmente nublado'],[3,'☁️','Nublado'],[45,'🌫️','Niebla'],[51,'🌦️','Llovizna'],[56,'🌧️','Llovizna helada'],[61,'🌧️','Lluvia'],[66,'🌧️','Lluvia helada'],[71,'🌨️','Nieve'],[80,'🌦️','Chubascos'],[85,'🌨️','Chubascos de nieve'],[95,'⛈️','Tormenta']];
function wmo(c){ let r = WMO[0]; WMO.forEach(function(x){ if (Number(c) >= x[0]) r = x; }); return r; }
function rumbo(g){ return ['N','NE','E','SE','S','SO','O','NO'][Math.round((((Number(g)||0) % 360) + 360) % 360 / 45) % 8]; }
function vClase(v){ return v == null || isNaN(v) ? '' : v <= 10 ? 'v-ok' : v <= 15 ? 'v-med' : 'v-alto'; }
function r0(v){ return v == null || isNaN(v) ? '–' : Math.round(v); }
function horaTxt(t){ const d = new Date(t); return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); }
function urlClima(lat, lon){
  return 'https://api.open-meteo.com/v1/forecast?latitude=' + Number(lat).toFixed(4) + '&longitude=' + Number(lon).toFixed(4) +
    '&current=temperature_2m,relative_humidity_2m,wind_speed_10m,wind_gusts_10m,wind_direction_10m,weather_code' +

}
async function pedirClima(lat, lon){

// Coordenadas escritas en el lugar o en un enlace de Google Maps (ej.: -33.76,-70.74)
function coordsDe(txt){ let t = String(txt || ''); try { t = decodeURIComponent(t); } catch (e) {} const m = t.match(/(-\d{1,2}\.\d{3,})\s*,\s*(-\d{1,3}\.\d{3,})/); return m ? { lat: Number(m[1]), lon: Number(m[2]) } : null; }
function repintarClima(){ if (S.d && (S.vista === 'hoy' || S.vista === 'agenda')) render(); }
async function actualizarClima(gps){
  if (CL.cargando) return;

  try {
    if (gps || !CL.pos) {
      if (!navigator.geolocation) throw new Error('Este teléfono no entrega la ubicación.');

      const nuevo = { lat: p.coords.latitude, lon: p.coords.longitude, t: Date.now(), nombre: '' };
      if (CL.pos && Math.abs(CL.pos.lat - nuevo.lat) + Math.abs(CL.pos.lon - nuevo.lon) < 0.02) nuevo.nombre = CL.pos.nombre || '';
      if (!nuevo.nombre) {
        try { const g = await fetch('https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=' + nuevo.lat + '&longitude=' + nuevo.lon + '&localityLanguage=es').then(function(r){ return r.json(); }); nuevo.nombre = g.city || g.locality || ''; } catch (e) {}
      }

}

function horaClima(d, fecha, hora){

function lunes(s){ const d = aFecha(s); const k = (d.getDay()+6)%7; d.setDate(d.getDate()-k); return iso(d); }

    const p = cola()[0];
    try { await api('webGuardarInforme', p); ok++; const r = cola(); r.shift(); guardarLocal('ranco_cola', r); }
    catch (e) { if (avisar) toast('Todavía sin conexión. Se reintenta solo.'); break; }
  }
  colaActiva = false;
  if (ok) { toast(ok === 1 ? 'Se envió el informe pendiente.' : 'Se enviaron ' + ok + ' informes pendientes.'); cargar(); }
}
window.addEventListener('online', function(){ enviarCola(); });
setInterval(function(){ if (navigator.onLine) enviarCola(); }, 60000);

// ---------- CLIENTES ----------
function vClientes(){
  const fl = S.filtro.toLowerCase();
  const ha = {}; (S.d.resumen.clientes||[]).forEach(function(c){ ha[c.nombre] = c.ha; });
  let h = '<div class="top"><h1>Clientes</h1></div><div class="buscar"><input type="search" placeholder="Buscar cliente" value="' + esc(S.filtro) + '" oninput="S.filtro=this.value;render();var i=document.querySelector(\'.buscar input\');i.focus();i.setSelectionRange(i.value.length,i.value.length)"></div><div class="lista" style="margin-top:12px">';
  S.d.clientes.filter(function(c){ return !fl || c.toLowerCase().indexOf(fl) >= 0; }).forEach(function(c){
    h += '<button class="cli" onclick="abrirCliente(\'' + esc(c).replace(/'/g,'\\\'') + '\')"><span class="ini">' + esc(iniciales(c)) + '</span><span style="flex:1"><b style="font-size:16px">' + esc(c) + '</b>' + (ha[c] ? '<br><span class="sub">' + fmt(ha[c]) + ' há este año</span>' : '') + '</span>' + I.der + '</button>';
  });
  return h + '</div>';
}
function iniciales(c){ return c.split(/\s+/).filter(function(w){ return w.length > 2 || /^[A-Z]/.test(w); }).slice(0,2).map(function(w){ return w[0]; }).join('').toUpperCase() || c.slice(0,2).toUpperCase(); }
async function abrirCliente(n){
  S.cliente = { nombre: n, historial: null }; S.vista = 'cliente'; render();
  try { S.cliente = await api('webCliente', n); render(); } catch(e) { toast('No se pudo cargar el historial (sin conexión).'); }
}
function vCliente(){
  const c = S.cliente;
  let h = '<div class="top" style="justify-content:flex-start"><button class="btn sec icon" aria-label="Volver" onclick="ir(\'clientes\')">' + I.izq + '</button><span class="sub">Clientes</span></div>';
  h += '<div class="pad" style="display:flex;align-items:center;gap:14px"><span class="ini" style="width:56px;height:56px;font-size:22px">' + esc(iniciales(c.nombre)) + '</span><div><h1 style="font-size:23px">' + esc(c.nombre) + '</h1></div></div>';
  const tel = String(c.telefono||'').replace(/[^\d+]/g,'');
  h += '<div class="stats" style="grid-template-columns:repeat(3,minmax(0,1fr))">' +
    (tel ? '<a class="btn sec" href="https://wa.me/' + tel.replace(/^\+/,'') + '" target="_blank" rel="noopener">WhatsApp</a><a class="btn sec" href="tel:' + tel + '">Llamar</a>' : '<span></span><span></span>') +
    '<button class="btn" onclick="S.edAg={cliente:S.cliente.nombre,fecha:\'' + sumar(S.d.hoy,1) + '\',hora:\'08:00\',duracion:3,piloto:pilotoDefecto()};pintarModalAgenda()">Agendar</button></div>';
  if (!c.historial) return h + '<p class="cargando">Cargando historial…</p>';
  const tot = c.historial.reduce(function(s,x){ return s + x.ha; }, 0);
  h += '<div class="stats"><div class="stat"><b>' + fmt(tot) + '</b><span>há aplicadas</span></div><div class="stat"><b>' + c.historial.length + '</b><span>aplicaciones</span></div><div class="stat"><b>' + (c.historial[0] ? corta(c.historial[0].fecha) : '—') + '</b><span>última</span></div></div>';
  h += '<h2 class="sec">Historial</h2><div class="lista">';
  if (!c.historial.length) h += '<p class="vacio">Aún no hay aplicaciones registradas.</p>';
  c.historial.forEach(function(x){
    h += '<div class="card" style="flex-direction:row;align-items:center"><div style="flex:1"><b style="font-size:15px">' + corta(x.fecha) + (x.productos ? ' · ' + esc(x.productos) : '') + '</b><p style="font-size:13px">' + esc([x.predio, x.cultivo, fmt(x.ha) + ' há', x.equipo].filter(Boolean).join(' · ')) + '</p></div>' +
      (x.pdf && /^https?:/.test(x.pdf) ? '<a class="btn azul" href="' + esc(x.pdf) + '" target="_blank" rel="noopener">PDF</a>' : '<span class="tag gris">' + esc(x.id) + '</span>') + '</div>';
  });
  return h + '</div>';
}

// ---------- RESUMEN ----------
function vResumen(){
  const r = S.d.resumen;
  let h = '<div class="top"><h1>Resumen</h1></div><p class="sub pad">Temporada ' + r.anio + ' · ' + r.aplicaciones + ' aplicaciones</p>';
  h += '<section class="sec-card"><p class="sub">Hectáreas aplicadas</p><div style="font-size:34px;font-weight:800">' + fmt(r.total) + ' <span style="font-size:16px;color:var(--muted)">há</span></div>';
  const meses = r.meses.slice(-6), mx = Math.max.apply(null, meses.map(function(m){ return m.ha; }).concat([1]));
  if (meses.length) {
    h += '<div class="barras">' + meses.map(function(m){ return '<div><span>' + fmt(m.ha) + '</span><i class="' + (m.ha===mx?'max':'') + '" style="height:' + Math.max(4, Math.round(m.ha/mx*110)) + 'px"></i></div>'; }).join('') + '</div>';
    h += '<div class="ejes">' + meses.map(function(m){ return '<span>' + MESES[Number(m.nombre.slice(5,7))-1] + '</span>'; }).join('') + '</div>';
  } else h += '<p class="vacio">Todavía no hay aplicaciones registradas este año.</p>';
  h += '</section>';
  if (r.equipos.length) {
    const te = r.equipos.reduce(function(s,e){ return s + e.ha; }, 0) || 1;
    h += '<section class="sec-card"><p class="sub">Por equipo</p><div style="display:flex;height:14px;border-radius:7px;overflow:hidden">' + r.equipos.map(function(e, i){ return '<div style="width:' + (e.ha/te*100) + '%;background:' + ['#2E6A12','#40C1E4','#9AA09A'][i%3] + '"></div>'; }).join('') + '</div>';
    h += '<div class="fila" style="flex-wrap:wrap">' + r.equipos.map(function(e, i){ return '<span style="display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700"><span style="width:10px;height:10px;border-radius:3px;background:' + ['#2E6A12','#40C1E4','#9AA09A'][i%3] + '"></span>' + esc(e.nombre) + ' · ' + fmt(e.ha) + ' há</span>'; }).join('') + '</div></section>';
  }
  if (r.clientes.length) {
    const mc = r.clientes[0].ha || 1;
    h += '<section class="sec-card"><p class="sub">Por cliente</p>' + r.clientes.map(function(c){ return '<div class="hbar"><span class="n">' + esc(c.nombre) + '</span><span class="t"><i style="width:' + Math.round(c.ha/mc*100) + '%"></i></span><span class="v">' + fmt(c.ha) + '</span></div>'; }).join('') + '</section>';
  }
  h += '<section class="sec-card"><p class="sub">Sesión</p><div class="fila" style="align-items:center"><span style="flex:1;font-weight:700">' + esc(S.d.usuario || localStorage.getItem('ranco_usuario') || '') + '</span><button class="btn sec" onclick="salir()">Salir</button></div><p class="sub" style="margin-top:10px">Ranco app v' + VERSION + '</p></section>';
  return h;
}

if ('serviceWorker' in navigator) window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
cargar();
</script>
